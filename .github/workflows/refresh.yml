name: Refresh sponsor register

on:
  schedule:
    - cron: "30 5 * * *"   # every day 05:30 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab
  push:
    branches: [main]
    paths: ["pipeline/**"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s pipeline

      - name: Run pipeline
        run: python pipeline/refresh.py

      - name: Commit updated data
        run: |
          git config user.name "sponsorsignal-bot"
          git config user.email "actions@github.com"
          # -A because the run also regenerates the landing pages,
          # sitemap.xml and the browse links inside index.html.
          git add -A
          git diff --cached --quiet || git commit -m "Data refresh: $(date -u +%F)"
          git push
